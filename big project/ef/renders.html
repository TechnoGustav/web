<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Renders</title>
  <link rel="stylesheet" href="port.css" />
  <link rel="stylesheet" href="videos.css" />
</head>
<body>
  <p class="page-label">Renders</p>
  <a href="port.html" class="back">← Back</a>
  <div class="video-list" id="video-list"></div>

  <script>
    fetch('renders.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('video-list');
        data.forEach(entry => {
          const wrapper = document.createElement('div');
          wrapper.className = 'entry';

          const text = document.createElement('div');
          text.className = 'entry-text';
          text.textContent = entry.text;

          const media = document.createElement('div');
          media.className = 'entry-media';

          if (entry.type === 'youtube') {
            let videoId = '';
            if (entry.src.includes('watch?v=')) {
              videoId = entry.src.split('watch?v=')[1];
            } else if (entry.src.includes('embed/')) {
              videoId = entry.src.split('embed/')[1];
            }
            media.innerHTML = `
              <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" rel="noopener">
                <img src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg" alt="YouTube video" />
              </a>`;
          } else if (entry.type === 'image') {
            media.innerHTML = `<img src="${entry.src}" alt="entry" />`;
          } else if (entry.type === 'video') {
            media.innerHTML = `
              <video controls preload="metadata" class="custom-video">
                <source src="${entry.src}" type="video/mp4">
                Your browser does not support the video tag.
              </video>`;
          }

          wrapper.appendChild(text);
          wrapper.appendChild(media);
          container.appendChild(wrapper);
        });
      })
      .catch(err => {
        document.getElementById('video-list').innerHTML = '<p>Error loading entries.</p>';
        console.error(err);
      });
  </script>
</body>
</html>
